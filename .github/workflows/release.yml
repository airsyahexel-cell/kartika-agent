name: Release Binaries

# LAPIS 2: GitHub Releases — membangun binary multi-OS pada setiap tag v*
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { os: linux,   arch: amd64, ext: ""     }
          - { os: windows, arch: amd64, ext: ".exe" }
          - { os: darwin,  arch: arm64, ext: ""     }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        run: |
          mkdir -p dist
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
            go build -ldflags="-s -w" -o dist/kartika-agent-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} .

      - name: Upload ke GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
